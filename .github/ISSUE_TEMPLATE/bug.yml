name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `job-pipeline doctor`
      render: text
  - type: input
    id: agent
    attributes:
      label: Agent and version (Claude Code, Codex, …)
  - type: markdown
    attributes:
      value: Please remove personal data (names, emails, CV text) before posting.
